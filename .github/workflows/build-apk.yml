# HGhub Android APK 云端打包工作流
# 用法：
#   1. 把本文件放到你 fork 的仓库的 .github/workflows/build-apk.yml
#   2. 仓库 Actions 页 → 左侧 "Build Android APK" → Run workflow
#   3. 跑完后在 Artifacts 里下载 hghub-apk（含 app-debug.apk）
# 注意：NDK 版本号若报错，用 `sdkmanager --list` 查当前可用版本后替换下面的值。

name: Build Android APK

on:
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK + NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Init Android project
        run: pnpm android:init

      - name: Build debug APK
        run: pnpm tauri android build --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hghub-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
